<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Aura -->
  <circle cx="50" cy="50" r="48" fill="#090b10" stroke="#d4af37" stroke-width="2.5" />
  
  <!-- Outer Occult Sigil Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" />
  
  <!-- Eye Outline (Sclera) -->
  <path d="M 12 50 Q 50 18 88 50 Q 50 82 12 50 Z" fill="#0f172a" stroke="#d4af37" stroke-width="3" filter="url(#glow)" />
  
  <!-- Iris -->
  <circle cx="50" cy="50" r="18" fill="url(#iris)" stroke="#e11d48" stroke-width="2" />
  
  <!-- Pupil (Slit / Cosmic Core) -->
  <ellipse cx="50" cy="50" rx="4.5" ry="14" fill="#000000" stroke="#fbbf24" stroke-width="0.8" />
  
  <!-- Pupil Reflection / Spark -->
  <circle cx="47" cy="44" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>
